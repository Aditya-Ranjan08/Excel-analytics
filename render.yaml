services:
  - type: web
    name: excel-analytics-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        value: https://${{excel-analytics-frontend.host}}

  - type: static
    name: excel-analytics-frontend
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://${{excel-analytics-api.host}}/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
